services:
  xss-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: xss_root_local
      MARIADB_DATABASE: medcare_db
      MARIADB_USER: helpdesk_user
      MARIADB_PASSWORD: helpdesk_pass123
    volumes:
      - xss_data:/var/lib/mysql
      - ./xss/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [xss-net]

  xss:
    build: ./xss
    restart: unless-stopped
    depends_on:
      xss-db:
        condition: service_healthy
    environment:
      DB_HOST: xss-db
      DB_NAME: medcare_db
      DB_USER: helpdesk_user
      DB_PASSWORD: helpdesk_pass123
    volumes:
      - ./xss/index.php:/var/www/html/index.php:ro
    ports:
      - "8081:80"
    networks: [xss-net]

  csrf-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: csrf_root_local
      MARIADB_DATABASE: netbank_db
      MARIADB_USER: netbank_user
      MARIADB_PASSWORD: netbank_pass123
    volumes:
      - csrf_data:/var/lib/mysql
      - ./csrf/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [csrf-net]

  csrf:
    build: ./csrf
    restart: unless-stopped
    depends_on:
      csrf-db:
        condition: service_healthy
    environment:
      DB_HOST: csrf-db
      DB_NAME: netbank_db
      DB_USER: netbank_user
      DB_PASSWORD: netbank_pass123
    volumes:
      - ./csrf/index.php:/var/www/html/index.php:ro
    ports:
      - "8082:80"
    networks: [csrf-net]

  csrf-attacker:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./csrf/attacker:/usr/share/nginx/html:ro
    ports:
      - "8083:80"
    networks: [csrf-net]

volumes:
  xss_data:
  csrf_data:

networks:
  xss-net:
  csrf-net:
